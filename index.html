<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ECEEEA">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Harmony Path</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#ECEEEA;--surface:#FFFFFF;--surface2:#F5F6F3;--border:#DCE0DB;--border2:#C9CFC9;
  --text:#15191B;--text2:#3A4246;--muted:#61696E;--muted2:#8A9196;
  --accent:#2C6A5A;--accent-bg:#DCEAE4;--accent-line:#B9D5C9;--accent-hover:#22564A;--on-accent:#FFFFFF;
  --amber:#8A5510;--amber-bg:#F5E6CF;--amber-line:#E2C48F;
  --purple:#6B3FA0;--purple-bg:#F0E8F7;--purple-line:#D5C3EA;
  --red:#9B2C2C;--red-bg:#F8E4E2;--on-red:#FFFFFF;--blue:#1D4E89;--pink:#9B2C6B;--pink-bg:#FBEAF2;
  --track:#E3E7E2;--zone:#CFE3DA;--scrim:rgba(17,21,20,0.45);
  --radius:14px;--radius-sm:10px;--radius-lg:20px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow:0 4px 16px rgba(0,0,0,0.08),0 1px 4px rgba(0,0,0,0.05);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.14);
  --f-display:'Archivo','Helvetica Neue',Arial,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;
  --tabbar-h:64px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111514;--surface:#1A1F1D;--surface2:#232A27;--border:#2F3633;--border2:#434C48;
  --text:#E7ECE9;--text2:#C4CCC8;--muted:#9AA4A0;--muted2:#7F8984;
  --accent:#6DBFA6;--accent-bg:#1E3832;--accent-line:#2F5A4E;--accent-hover:#86CDB7;--on-accent:#0B1A15;
  --amber:#E2AA55;--amber-bg:#33281A;--amber-line:#5A4524;
  --purple:#C7B0EA;--purple-bg:#2A2236;--purple-line:#4A3D60;
  --red:#EC7B74;--red-bg:#3A1F1E;--on-red:#2A0F0E;--blue:#8FB2E6;--pink:#E58ABB;--pink-bg:#3A1F2D;
  --track:#2A322F;--zone:#24493F;--scrim:rgba(0,0,0,0.6);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.5);--shadow:0 4px 16px rgba(0,0,0,0.5);--shadow-lg:0 12px 40px rgba(0,0,0,0.6);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;overflow-x:clip;}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
.topbar{position:sticky;top:0;z-index:200;}
.site-header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px 12px;padding-top:calc(env(safe-area-inset-top) + 16px);box-shadow:var(--shadow-sm);}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1100px;margin:0 auto;}
.logo h1{font-size:1.1rem;font-weight:800;letter-spacing:-0.02em;}
.logo h1 span{color:var(--accent);}
.logo p{font-size:0.65rem;color:var(--muted);margin-top:1px;letter-spacing:0.02em;}
.header-btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.hbtn{font-family:inherit;font-size:0.72rem;font-weight:600;padding:7px 12px;border:1.5px solid var(--border2);background:var(--surface);color:var(--text2);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;white-space:nowrap;}
.hbtn:hover{background:var(--surface2);border-color:var(--accent);color:var(--accent);}
.nav-wrap{background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.nav-wrap::-webkit-scrollbar{display:none;}
.nav{display:flex;width:max-content;min-width:100%;padding:0 10px;max-width:1100px;margin:0 auto;}
.ntab{font-family:inherit;font-weight:700;font-size:0.74rem;padding:11px 13px;border:none;border-bottom:2.5px solid transparent;background:none;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s;display:flex;align-items:center;gap:6px;}
.ntab.active{color:var(--accent);border-bottom-color:var(--accent);}
.ntab .lock{font-size:0.7rem;opacity:0.5;}
.ntab .mod-dot{width:7px;height:7px;border-radius:50%;background:var(--border2);}
.ntab .mod-dot.done{background:var(--accent);}
.ntab .mod-dot.part{background:var(--amber);}
.wrap{max-width:1100px;margin:0 auto;padding:18px 18px 60px;}
.mod-head{margin-bottom:6px;}
.mod-head .mtag{font-size:0.6rem;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);}
.mod-head h2{font-size:1.3rem;font-weight:800;letter-spacing:-0.02em;margin-top:3px;}
.mod-head p{font-size:0.82rem;color:var(--text2);margin-top:6px;line-height:1.5;max-width:680px;}
.mod-prog{display:flex;align-items:center;gap:10px;margin:14px 0 4px;}
.bar{flex:1;height:7px;background:var(--surface2);border-radius:4px;overflow:hidden;border:1px solid var(--border);}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s;}
.mod-prog span{font-size:0.66rem;font-weight:700;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.lesson{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--border2);border-radius:var(--radius);padding:14px 15px;margin-top:10px;display:flex;gap:13px;align-items:flex-start;cursor:pointer;transition:box-shadow .15s,transform .1s;position:relative;}
.lesson:hover{box-shadow:var(--shadow);}
.lesson:active{transform:scale(.997);}
.lesson.locked{cursor:not-allowed;opacity:0.6;background:var(--surface2);}
.lesson.locked.challenge{cursor:pointer;opacity:0.85;}
.lesson.locked.challenge .l-status{color:var(--purple);}
.today-p{font-size:0.82rem;color:var(--text2);line-height:1.5;margin:4px 0 8px;}
.today-streak{text-align:center;font-size:0.74rem;color:var(--muted);margin-top:16px;}
.challenge-note{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-line);border-radius:var(--radius-sm);padding:10px 12px;font-size:0.76rem;line-height:1.5;margin-top:10px;}
.lesson.mastered{border-left-color:var(--accent);}
.lesson.available{border-left-color:var(--amber);}
.lesson.cp{border-left-color:var(--purple);background:linear-gradient(0deg,var(--purple-bg),var(--surface) 60%);}
.lesson.cp.mastered{border-left-color:var(--accent);}
.l-badge{width:38px;height:38px;min-width:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.8rem;font-family:'JetBrains Mono',monospace;background:var(--surface2);color:var(--muted);border:1.5px solid var(--border2);}
.l-badge.mastered{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.l-badge.available{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line);}
.l-badge.cp{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-line);}
.l-badge.cp.mastered{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.l-main{flex:1;min-width:0;}
.l-title{font-size:0.92rem;font-weight:700;line-height:1.3;}
.l-focus{font-size:0.74rem;color:var(--muted);margin-top:3px;line-height:1.45;}
.l-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.chip{font-family:'JetBrains Mono',monospace;font-size:0.56rem;padding:2px 6px;border-radius:3px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);}
.chip.tempo{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber);}
.chip.covers{background:var(--accent-bg);border-color:var(--accent-line);color:var(--blue);}
.chip.cp{background:var(--purple-bg);border-color:var(--purple-line);color:var(--purple);}
.l-status{font-size:0.62rem;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;align-self:flex-start;white-space:nowrap;}
.l-status.mastered{color:var(--accent);}
.l-status.available{color:var(--amber);}
.l-status.locked{color:var(--muted2);}
.scrim{display:none;position:fixed;inset:0;background:var(--scrim);z-index:899;}
.scrim.open{display:block;}
.detail{display:none;position:fixed;inset:0;z-index:910;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;flex-direction:column;}
.detail.open{display:flex;}
.d-close{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 20px 12px;background:var(--surface);border-bottom:1px solid var(--border);font-size:0.65rem;color:var(--muted);font-weight:700;position:sticky;top:0;z-index:10;letter-spacing:0.05em;text-transform:uppercase;}
.d-close button{border:1.5px solid var(--border2);background:var(--surface2);color:var(--text2);border-radius:var(--radius-sm);padding:7px 14px;font-size:0.72rem;font-weight:700;cursor:pointer;font-family:inherit;}
.d-body{padding:24px 20px calc(env(safe-area-inset-bottom) + 40px);max-width:720px;margin:0 auto;width:100%;}
.d-title{font-size:1.5rem;font-weight:800;letter-spacing:-0.02em;line-height:1.2;}
.d-focus{font-size:0.95rem;color:var(--text2);margin-top:8px;line-height:1.6;}
.d-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.d-section{margin-top:24px;}
.d-h{font-size:0.6rem;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);margin-bottom:11px;}
.d-h.cp{color:var(--purple);}
.d-h.std{color:var(--amber);}
.item{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);}
.item:last-child{border-bottom:none;}
.check{width:22px;height:22px;min-width:22px;border-radius:6px;border:2px solid var(--border2);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .12s;}
.check.on{background:var(--accent);border-color:var(--accent);}
.check.on::after{content:'✓';color:var(--on-accent);font-size:0.8rem;font-weight:800;}
.check.std.on{background:var(--amber);border-color:var(--amber);}
.item-text{font-size:0.9rem;line-height:1.55;color:var(--text2);flex:1;}
.std .item-text{font-weight:600;color:var(--text);}
.notes{width:100%;border:1.5px solid var(--border2);border-radius:8px;padding:11px 13px;font-size:0.88rem;font-family:inherit;color:var(--text);background:var(--surface2);resize:vertical;min-height:80px;line-height:1.55;-webkit-appearance:none;}
.notes:focus{outline:none;border-color:var(--accent);}
.cp-note{background:var(--purple-bg);border:1px solid var(--purple-line);border-radius:var(--radius);padding:14px 16px;font-size:0.85rem;line-height:1.6;color:var(--text2);}
.cp-note b{color:var(--purple);}
.master-btn{width:100%;margin-top:26px;padding:16px;border-radius:var(--radius);border:none;font-family:inherit;font-size:0.95rem;font-weight:800;cursor:pointer;transition:all .15s;letter-spacing:0.02em;}
.master-btn.ready{background:var(--accent);color:var(--on-accent);}
.master-btn.ready:hover{background:var(--accent-hover);}
.master-btn.notready{background:var(--surface2);color:var(--muted2);border:1.5px solid var(--border);cursor:not-allowed;}
.master-btn.done{background:var(--accent-bg);color:var(--accent);border:1.5px solid var(--accent);}
.gate-hint{text-align:center;font-size:0.72rem;color:var(--muted);margin-top:10px;}
.unmark{display:block;margin:14px auto 0;background:none;border:none;color:var(--muted);font-size:0.72rem;text-decoration:underline;cursor:pointer;font-family:inherit;}
.bcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-top:14px;box-shadow:var(--shadow-sm);}
.bcard-title{font-size:0.95rem;font-weight:800;color:var(--accent);margin-bottom:3px;}
.bcard-sub{font-size:0.66rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:10px;}
.bcard ul{list-style:none;}
.bcard li{font-size:0.84rem;line-height:1.55;padding:6px 0 6px 20px;position:relative;border-bottom:1px solid var(--border);}
.bcard li:last-child{border-bottom:none;}
.bcard li::before{content:'›';position:absolute;left:2px;top:5px;color:var(--accent);font-weight:800;}
.road{margin-top:6px;}
.road-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
.road-row:last-child{border-bottom:none;}
.road-tag{font-size:0.58rem;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;padding:3px 8px;border-radius:4px;white-space:nowrap;min-width:74px;text-align:center;background:var(--accent-bg);color:var(--accent);}
.road-tag.c{background:var(--purple-bg);color:var(--purple);}
.road-tag.peak{background:var(--red-bg);color:var(--red);}
.road-body{font-size:0.8rem;color:var(--text2);line-height:1.45;}
.road-body b{color:var(--text);font-family:'JetBrains Mono',monospace;font-weight:500;}
.pmod{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.pmod:last-child{border-bottom:none;}
.pmod-n{font-size:0.7rem;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--muted);min-width:26px;}
.pmod-t{flex:1;font-size:0.86rem;font-weight:600;}
.pmod-c{font-size:0.66rem;font-family:'JetBrains Mono',monospace;color:var(--muted);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:var(--bg);padding:12px 22px;border-radius:24px;font-size:0.82rem;font-weight:700;z-index:999;transition:transform .28s cubic-bezier(.22,1,.36,1);box-shadow:var(--shadow-lg);}
.toast.show{transform:translateX(-50%) translateY(0);}
.storage-banner{background:var(--amber-bg);color:var(--amber);font-size:0.72rem;padding:8px 16px;text-align:center;font-weight:600;display:none;}
/* ---- audio tool panel ---- */
.tool-panel{background:var(--surface);border:1.5px solid var(--accent);border-radius:var(--radius);padding:14px 16px;margin-top:14px;box-shadow:var(--shadow-sm);}
.tool-panel .t-title{font-size:0.6rem;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
.t-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;}
.t-label{font-size:0.66rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;min-width:100%;margin-top:6px;}
.t-target{display:none;font-size:0.74rem;font-weight:600;color:var(--accent);background:var(--accent-bg);border-radius:var(--radius-sm);padding:8px 11px;margin-top:8px;line-height:1.45;}
.t-target.show{display:block;}
.tbtn{font-family:inherit;font-size:0.78rem;font-weight:700;padding:9px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer;transition:all .15s;}
.tbtn:hover{background:var(--accent-hover);}
.tbtn.sec{background:var(--surface);color:var(--accent);}
.tbtn.sec:hover{background:var(--accent-bg);}
.tbtn.warn{background:var(--surface);color:var(--amber);border-color:var(--amber);}
.tsel{font-family:'JetBrains Mono',monospace;font-size:0.78rem;font-weight:500;padding:8px 10px;border-radius:var(--radius-sm);border:1.5px solid var(--border2);background:var(--surface2);color:var(--text);}
.t-hint{font-size:0.7rem;color:var(--muted);margin-top:9px;line-height:1.5;}
/* ---- live tuner ---- */
.pd{margin-top:11px;padding:11px 12px;border:1.5px dashed var(--border2);border-radius:var(--radius-sm);background:var(--surface2);transition:border-color .15s,background .15s;}
.pd.locked{border-style:solid;border-color:var(--accent);background:var(--accent-bg);}
.pd-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.pd-read{display:flex;align-items:baseline;gap:7px;font-family:'JetBrains Mono',monospace;}
.pd-note{font-size:1.25rem;font-weight:700;color:var(--text);min-width:42px;}
.pd-cents{font-size:0.72rem;color:var(--muted);}
.pd-lock{margin-left:auto;font-size:0.66rem;font-weight:800;letter-spacing:0.04em;padding:3px 8px;border-radius:4px;background:var(--surface);border:1px solid var(--border);color:var(--muted);white-space:nowrap;}
.pd-lock.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.pd-lock.sharp,.pd-lock.flat{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line);}
.pd-msg{display:none;font-size:0.72rem;color:var(--red);font-weight:600;margin-top:9px;line-height:1.45;}
.pd-msg.show{display:block;}
.pd-scoop{display:none;align-items:center;gap:10px;margin-top:9px;padding:7px 9px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);}
.pd-scoop.show{display:flex;}
.pd-scoop.ok{background:var(--accent-bg);border-color:var(--accent-line);}
.pd-scoop.soft{background:var(--amber-bg);border-color:var(--amber-line);}
.pd-scoop.warn{background:var(--amber-bg);border-color:var(--amber-line);}
.pd-scoop .scoop-v{flex:1;font-size:0.74rem;font-weight:700;line-height:1.3;}
.pd-scoop.ok .scoop-v{color:var(--accent);}
.pd-scoop.soft .scoop-v{color:var(--amber);}
.pd-scoop.warn .scoop-v{color:var(--amber);}
/* ---- in-app recorder ---- */
.rec{margin-top:12px;padding:13px 14px;border:1.5px solid var(--purple);border-radius:var(--radius);background:linear-gradient(0deg,var(--purple-bg),var(--surface) 70%);}
.rec-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.rec-btn{font-family:inherit;font-size:0.82rem;font-weight:800;padding:10px 16px;border-radius:var(--radius-sm);border:none;background:var(--red);color:var(--on-red);cursor:pointer;display:flex;align-items:center;gap:7px;}
.rec-btn.stop{background:var(--text);}
.rec-dot{width:9px;height:9px;border-radius:50%;background:var(--on-red);}
.rec-btn.live .rec-dot{animation:recpulse 1s infinite;}
@keyframes recpulse{0%,100%{opacity:1}50%{opacity:.25}}
.rec-time{font-family:'JetBrains Mono',monospace;font-size:0.9rem;font-weight:600;color:var(--text2);}
.rec audio{width:100%;margin-top:11px;height:38px;}
.rec-dl{display:inline-block;margin-top:9px;font-size:0.74rem;font-weight:700;color:var(--purple);text-decoration:underline;cursor:pointer;}
.rec-hint{font-size:0.68rem;color:var(--muted);margin-top:8px;line-height:1.5;}
/* ---- tempo slider + count-in ---- */
.slider-row{display:flex;align-items:center;gap:11px;margin-top:8px;}
.slider-row label{font-size:0.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;min-width:48px;}
.slider-row input[type=range]{flex:1;accent-color:var(--accent);height:4px;}
.slider-val{font-family:'JetBrains Mono',monospace;font-size:0.82rem;font-weight:600;color:var(--accent);min-width:62px;text-align:right;}
.toggle-chip{display:inline-flex;align-items:center;gap:6px;font-size:0.72rem;font-weight:700;padding:7px 11px;border-radius:var(--radius-sm);border:1.5px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer;user-select:none;}
.toggle-chip.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);}
.toggle-chip .tg{width:14px;height:14px;border-radius:3px;border:2px solid var(--border2);}
.toggle-chip.on .tg{background:var(--accent);border-color:var(--accent);}
/* ---- hold count (8) ---- */
.hold{display:flex;align-items:center;gap:12px;margin-top:8px;}
.hold-meter{flex:1;display:flex;align-items:center;gap:11px;}
.hold-num{font-family:'JetBrains Mono',monospace;font-size:1.9rem;font-weight:700;color:var(--muted);min-width:42px;text-align:center;transition:color .15s;}
.hold-prog{flex:1;height:9px;background:var(--surface2);border-radius:5px;overflow:hidden;border:1px solid var(--border);}
.hold-prog > i{display:block;height:100%;width:0;background:var(--accent);border-radius:5px;transition:width .25s linear;}
.hold-res{display:none;font-size:0.74rem;font-weight:700;margin-top:9px;padding:7px 10px;border-radius:var(--radius-sm);}
.hold-res.show{display:block;}
.hold-res.ok{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-line);}
.hold-res.warn{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-line);}
/* ---- lesson log / auto-test ---- */
.ll-auto{font-family:'JetBrains Mono',monospace;font-size:0.54rem;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--purple);background:var(--purple-bg);border:1px solid var(--purple-line);border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:middle;}
.lesson-log{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow-sm);}
.ll-prog{font-size:0.82rem;color:var(--text2);margin-bottom:10px;}
.ll-prog b{font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:700;}
.ll-pass{color:var(--accent);font-weight:800;font-size:0.74rem;}
.ll-empty{font-size:0.76rem;color:var(--muted);line-height:1.5;}
.ll-list{display:flex;flex-direction:column;gap:0;}
.ll-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--border);}
.ll-row:last-child{border-bottom:none;}
.ll-note{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:0.84rem;min-width:34px;}
.ll-b{font-family:'JetBrains Mono',monospace;font-size:0.58rem;font-weight:700;padding:2px 6px;border-radius:3px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);}
.ll-b.ok{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-line);}
.ll-b.soft{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line);}
.ll-b.warn{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line);}
.ll-lk{flex:1;font-size:0.72rem;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.ll-res{font-weight:800;font-size:0.9rem;}
.ll-res.p{color:var(--accent);}
.ll-res.f{color:var(--muted2);}
.ll-final{margin-top:12px;font-size:0.78rem;font-weight:700;padding:9px 11px;border-radius:var(--radius-sm);}
.ll-final.ok{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-line);}
/* ---- metronome ---- */
.metro-dot{width:54px;height:54px;border-radius:50%;background:var(--surface2);border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1rem;color:var(--muted);transition:transform .05s,background .05s,color .05s,border-color .05s;}
.metro-dot.beat{background:var(--accent);color:var(--on-accent);border-color:var(--accent);transform:scale(1.12);}
.metro-dot.accent{background:var(--amber);border-color:var(--amber);}
/* ---- quick drill ---- */
.qd-cta{width:100%;margin-top:14px;padding:15px;border-radius:var(--radius);border:none;background:var(--accent);color:var(--on-accent);font-family:inherit;font-size:0.92rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:var(--shadow-sm);}
.qd-cta:hover{background:var(--accent-hover);}
.qd-cta.sec{background:var(--purple-bg);color:var(--purple);border:1.5px solid var(--purple-line);box-shadow:none;}
.qd-big{font-family:'JetBrains Mono',monospace;font-size:2.4rem;font-weight:700;text-align:center;color:var(--accent);margin:6px 0;}
.qd-sub{text-align:center;font-size:0.78rem;color:var(--muted);margin-bottom:14px;}
.score-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px;}
.score-btn{width:42px;height:42px;border-radius:11px;border:1.5px solid var(--border2);background:var(--surface);font-size:1.3rem;font-weight:700;color:var(--accent);cursor:pointer;font-family:inherit;}
.score-val{font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:700;min-width:70px;text-align:center;}
/* ---- streak card ---- */
.streak{display:flex;gap:10px;margin-top:14px;}
.streak-box{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow-sm);}
.streak-box .sk-n{font-family:'JetBrains Mono',monospace;font-size:1.9rem;font-weight:700;color:var(--accent);line-height:1;}
.streak-box .sk-l{font-size:0.6rem;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-top:6px;}
.road-tag.mando{background:var(--pink-bg);color:var(--pink);}
@media(max-width:768px){
  .site-header{padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;}
  .logo p{display:none;}
  .ntab{font-size:0.84rem;padding:12px 13px;}
  .d-title{font-size:1.25rem;}
  .item-text{font-size:0.95rem;}
  .l-title{font-size:1rem;}
  .l-focus{font-size:0.82rem;}
}
/* ===== v40 redesign — shared with The Rebuild: eucalyptus palette, Archivo display, bottom tabs, dark mode ===== */
body{font-size:15px;}
.display{font-family:var(--f-display);font-weight:800;letter-spacing:-0.02em;line-height:1.04;color:var(--text);}
.eyebrow{font-family:var(--f-mono);font-size:0.72rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;}
.site-header{padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;box-shadow:none;}
.header-inner{max-width:760px;}
.logo{display:flex;align-items:baseline;gap:8px;}
.logo-zh{font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:var(--text);}
.logo-en{font-family:var(--f-display);font-weight:800;font-size:1.2rem;letter-spacing:-0.01em;color:var(--text);}
.logo-en span{color:var(--accent);}
.logo-v{font-family:var(--f-mono);font-size:0.68rem;color:var(--muted);}
.icon-btn{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}
.menu-scrim{display:none;position:fixed;inset:0;z-index:950;}
.menu-scrim.open{display:block;}
.menu{display:none;position:fixed;top:calc(env(safe-area-inset-top) + 62px);right:12px;z-index:960;width:min(300px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:8px;}
.menu.open{display:block;}
.menu-h{font-family:var(--f-mono);font-size:0.68rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px 6px;}
.menu-item{width:100%;min-height:44px;display:flex;align-items:center;gap:12px;padding:0 10px;border:0;background:none;border-radius:10px;font:inherit;font-size:0.92rem;font-weight:600;color:var(--text);cursor:pointer;text-align:left;}
.menu-item:hover{background:var(--surface2);}
.menu-item .ico{color:var(--muted);}
.menu-item.danger,.menu-item.danger .ico{color:var(--red);}
.menu-sep{height:1px;background:var(--border);margin:6px 4px;}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--surface2);}
.seg-b{min-height:40px;border:0;border-radius:10px;background:transparent;color:var(--text2);font:inherit;font-size:0.88rem;font-weight:600;cursor:pointer;}
.seg-b[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700;}
.menu .seg{margin:0 4px 4px;}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:800;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));padding:6px 6px env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--border);}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:none;color:var(--muted);font:inherit;font-size:0.72rem;font-weight:600;cursor:pointer;}
.tab .ico{width:24px;height:24px;stroke-width:1.8;}
.tab[aria-current="page"]{color:var(--accent);font-weight:700;}
.wrap{max-width:760px;padding:18px 18px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 28px);}
/* hidden = invisible, not just shifted: sitting above the tab bar, an 80px slide no longer
   took the toast off-screen, so an empty pill showed over the tabs (v40 bug) */
.toast{bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 14px);opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-50%) translateY(16px);transition:transform .28s cubic-bezier(.22,1,.36,1),opacity .2s,visibility .2s;}
.toast.show{opacity:1;visibility:visible;}
.mod-head .mtag{font-family:var(--f-mono);font-size:0.7rem;font-weight:600;}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}

.page-sub{font-size:0.86rem;color:var(--text2);margin-top:8px;line-height:1.45;}
.bar{background:var(--track);border:0;height:6px;}

.pills{display:flex;flex-wrap:wrap;gap:8px;}

.cta{width:100%;min-height:56px;margin-top:16px;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);font:inherit;font-size:1rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;}

(function(){var p='auto';try{p=localStorage.getItem('harmony_theme')||'auto';}catch(e){}
var mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
function apply(){var d=p==='dark'||(p==='auto'&&!!mq&&mq.matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',d?'#111514':'#ECEEEA');}
apply();if(mq){var f=function(){if(p==='auto')apply();};if(mq.addEventListener)mq.addEventListener('change',f);else if(mq.addListener)mq.addListener(f);}
window.__setTheme=function(v){p=v;try{localStorage.setItem('harmony_theme',v);}catch(e){}apply();};
window.__getTheme=function(){return p;};})();

<script>
/* ===================== PROGRAM DATA ===================== */
const MODULES=[
{n:1,t:'Hear & Hold a Note',g:'Harmony is mostly the skill of not being pulled onto someone else’s note. Before you sing different notes, you learn to hold your own note rock-steady while hearing something else. Everything later is built on this.',lessons:[
 {id:'1.1',t:'Land the Note',f:'Hit a played pitch instantly — no scooping up to it.',time:'~10 min',covers:'Pitch accuracy',tool:'tone',
  tasks:['Play a note in your comfortable range with the tone player. Sing it on “ooh” and hold for a slow count of 8.','Record yourself on your phone and listen back: did you start under the note and slide up? Most beginners scoop — aim to land dead-on instantly.','Repeat on five different roots, low and high.'],
  stds:['You land on the played note instantly, without sliding up to it.','You can hold it for 8 counts without drifting.','You verified this by listening back to a recording — not just by feel.'],
  auto:{checks:[{kind:'hold8',requireClean:true,minLock:7,need:3,stds:[0,1]}]}},
 {id:'1.2',t:'Hold Against the Drone',f:'Sustain your note while the same note drones underneath.',time:'~10 min',covers:'Stability',tool:'tone',
  tasks:['Start the drone. Sing the same note and hold 8 counts. When you are perfectly in tune the two voices fuse — learn that fused sound.','If you hear a slow “wah-wah-wah” beating, you are slightly off. Nudge your pitch until the beating stops.','Three holds per session, recorded once.'],
  stds:['A unison hold for 8 counts with no audible beating.','You can deliberately drift off the note and pull back into the fused sound.'],
  auto:{checks:[{kind:'hold8',requireClean:false,minLock:7,need:3,onDrone:true,stds:[0]},{kind:'driftReturn',need:2,stds:[1]}]}},
 {id:'1.3',t:'The Tug-of-War',f:'Hold your note while the drone plays a DIFFERENT note.',time:'~10 min',covers:'Independence',tool:'tone',
  tasks:['Drone on the root. Use the second-note buttons to hear a 3rd or 5th, sing that note, then keep holding it while the drone continues.','Your note will feel tugged toward the drone — do not let it move. That feeling of two notes ringing against each other IS harmony.','Record one hold per session and check it stayed put.'],
  stds:['You hold your note 8 counts against a different droning note.','Three clean holds in a row, confirmed by recording.'],
  auto:{checks:[{kind:'hold8',requireClean:true,minLock:7,need:3,consecutive:true,offDrone:true,stds:[0,1]}]}},
 {id:'1.4',t:'Steps Away',f:'Move deliberately while the drone stays still.',time:'~10 min',covers:'Controlled movement',tool:'tone',
  tasks:['With the drone on “do”, sing do–re–do slowly. Then do–re–mi–re–do.','Move slowly and deliberately; land each step, do not slide between them.','Finish each pass by locking back into unison with the drone.'],
  stds:['The steps are in tune on the way up and the way down.','The return to unison locks (no beating) every time.'],
  auto:{checks:[
   {kind:'stepSeq',pattern:[0,2,4,2,0],stepTol:45,lockTol:25,need:2,require:'inTune',stds:[0]},
   {kind:'stepSeq',pattern:[0,2,4,2,0],stepTol:45,lockTol:25,need:2,require:'lock',stds:[1]}
  ]}},
 {id:'1.5',t:'First Song',f:'Sing a whole tune in tune — Row, Row, Row Your Boat, the song you’ll harmonize in Module 3.',time:'~10 min',covers:'Pitch accuracy in a real song',tool:'row',song:'row',
  tasks:['Press “Melody only” and sing along on “loo”. Lower the tempo until every note lands cleanly — no sliding up into them.','Now sing it from memory with just the click. The app checks that each note lands in tune, in whatever key you choose.','Know this melody cold: in Module 3 you sing a harmony line against it, and it will try to pull you onto it.'],
  stds:['You can sing the Row Your Boat melody in tune from memory.'],
  auto:{checks:[{kind:'rowRun',memory:true,target:'mel',onPct:0.7,need:1,stds:[0]}]}},
 {id:'cpA',cp:true,t:'Checkpoint — The Drone Hold',f:'Prove the foundation holds before building on it.',covers:'Module 1',tool:'tone',
  rec:['Record ~45 seconds: with the drone on one note, sing and hold a different note (a 3rd or 5th) for 8 counts, three separate times.'],
  stds:['No audible drift on any of the three holds.','Each note is landed instantly, no scooping.'],
  auto:{checks:[{kind:'hold8',requireClean:true,minLock:7,need:3,consecutive:true,offDrone:true,stds:[0,1]}]}},
]},
{n:2,t:'Find the Third',g:'Roughly 80% of pop and folk harmony is singing a third above or below the melody — the warm sound in every Everly Brothers and Simon & Garfunkel record. A third is “do” up to “mi”. Part 1 builds it in small steps — hear it, echo it, half-walk to it, then jump to it — and ends with your first harmony in a song. Part 2 adds the 5th, the 4th and the minor thirds, each with a tune you already know as an anchor.',lessons:[
 {id:'2.1',part:'Part 1 · Find the third',t:'Walk Up to It',f:'Find the third by stepping: do–re–mi, hold the mi.',time:'~10 min',covers:'Interval: major 3rd',tool:'interval',intv:4,anchor:4,
  tasks:['Play a root. Sing do–re–mi up from it and hold the “mi”.','Press “Reveal answer” to check yourself. Then “Both together” to hear the third ringing against the root.','Repeat across ten different roots.'],
  stds:['You can land the third by walking up, from any root in your range.'],
  auto:{checks:[{kind:'stepSeq',pattern:[0,2,4],lockDeg:4,stepTol:45,lockTol:25,need:2,require:'both',stds:[0]}]}},
 {id:'2.hear',t:'Hear the Third',f:'Before you sing it, learn to recognise it: was that jump a 3rd?',time:'~5 min',covers:'Ear training',tool:'interval',intv:4,anchor:4,
  tasks:['Press “Hear the anchor” — “Oh when the saints”. Its first two notes, “Oh when”, go do up to mi: a major 3rd. That is the sound you are learning.','Start the listening quiz: the app plays two notes and you tap what the jump was — a step, a 3rd or a 5th. Nothing to sing yet.','A wrong answer replays the right one, so every round teaches. One quiz a day until you pass.','Once you pass, keep sharpening on Practice → Interval ear test: the root jumps every round, and it counts how many you get in a row.'],
  stds:['8 of 10: you can tell a 3rd from a step and a 5th by ear.'],
  auto:{checks:[{kind:'intervalQuiz',choices:[2,4,7],target:4,rounds:10,need:8,stds:[0]}]}},
 {id:'2.echo',t:'Echo the Third',f:'Hear do, then mi — sing the mi straight back. Copying comes before finding.',time:'~10 min',covers:'Imitation',tool:'interval',intv:4,anchor:4,
  tasks:['Start the echo drill. Each trial plays do, then mi; you sing mi straight back, on “ooh”.','The root stays the same all session, so the key settles in your ear.','Hear the two notes as one shape — a bright, open lift. That shape is what you will soon produce on your own.'],
  stds:['8 of 10: you echo the third in tune.'],
  auto:{checks:[{kind:'jumpN',interval:'e3',iv:4,cue:'echo',steady:true,intName:'3rd · echo',trials:10,need:8,stds:[0]}]}},
 {id:'2.half',t:'Half a Walk',f:'Hear do–re, then sing mi on your own — the last step of the walk, unassisted.',time:'~10 min',covers:'Fading the help',tool:'interval',intv:4,anchor:4,
  tasks:['Start the drill. Each trial plays do, then re; you sing the next step — mi — without hearing it.','Same root all session. Stuck? Sing “do–re–mi” quietly once, then try again.','When it feels easy, think “do–re” in your head instead of listening for it — that inner walk is how the jump becomes instant.'],
  stds:['8 of 10: you sing mi after hearing do–re.'],

/* ===================== AUDIO ENGINE ===================== */
let actx=null,droneNodes=[],sessionMode='playback',actxMode='playback';
const TS={root:0,intv:4,key:0,droneOn:false,drone5:false,bpm:96,countin:true,holdOff:null,part:'above',droneVol:1};
/* holdOff = the "second note" offset (semitones above root) the live tuner is aimed
   at and the hold scorer locks to. null → the root itself (unison). It PERSISTS across
   drone/root toggles so enabling the tuner (which rebuilds the context and restarts the
   drone) can no longer snap the target back to unison. offDrone lessons default it to a
   3rd so the tuner stops guiding the singer to the drone's own note. */
function holdTargetSemi(){return TS.root+(TS.holdOff||0);}
function setAudioSession(mode){
 /* iOS WebKit AudioSession. 'playback' is output-only and is INCOMPATIBLE with
    mic capture; 'play-and-record' allows both. We remember the requested mode so a
    freshly created AudioContext adopts it. */
 sessionMode=mode;
 if(navigator.audioSession){try{navigator.audioSession.type=mode;}catch(e){}}
}
function ac(){
 if(!actx){
  actx=new (window.AudioContext||window.webkitAudioContext)();
  actxMode=sessionMode;
  if(navigator.audioSession){try{navigator.audioSession.type=sessionMode;}catch(e){}}
 }
 if(actx.state==='suspended')actx.resume();
 return actx;
}
/* iOS will not switch a live AudioContext between output-only ('playback') and
   capture ('play-and-record'), and stopping the mic can leave a play-and-record
   context unable to play. So we rebuild the context on each transition, restarting
   the drone if it was on. Transitions are serialized on a promise chain to avoid
   close/create races. */
let acChain=Promise.resolve();
function rebuildContext(mode){
 const wasDrone=TS.droneOn;
 return (actx?actx.close().catch(()=>{}):Promise.resolve()).then(()=>{
  actx=null;droneNodes=[];TS.droneOn=false;pdSource=null;pdAnalyser=null;pdSink=null;
  setAudioSession(mode);ac();syncDroneBtns();
  if(wasDrone)toggleDrone();
 });
}
function enterCaptureMode(){
 acChain=acChain.then(()=>{
  setAudioSession('play-and-record');
  if(actx && actxMode!=='play-and-record')return rebuildContext('play-and-record');
  ac();
 });
 return acChain;
}
function exitCaptureMode(){
 acChain=acChain.then(()=>{
  if(pdActive||(mediaRec&&mediaRec.state==='recording'))return; // capture resumed
  setAudioSession('playback');
  if(actx && actxMode!=='playback')return rebuildContext('playback');
 });
 return acChain;
}
/* iOS unlock: the context only truly starts inside a user gesture — resume it and
   play one silent sample on the first touch/click anywhere. */
function unlockAudio(){
 const a=ac();
 const kick=()=>{try{const b=a.createBuffer(1,1,22050);const s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0);}catch(e){}};
 if(a.state==='running')kick();else a.resume().then(kick).catch(()=>{});
 document.removeEventListener('touchend',unlockAudio);
 document.removeEventListener('click',unlockAudio);
}
document.addEventListener('touchend',unlockAudio,{passive:true});
document.addEventListener('click',unlockAudio);

function toggleMenu(force){const m=document.getElementById('menu'),sc=document.getElementById('menuScrim'),b=document.getElementById('menuBtn');if(!m)return;const open=(force===undefined)?!m.classList.contains('open'):!!force;m.classList.toggle('open',open);if(sc)sc.classList.toggle('open',open);if(b)b.setAttribute('aria-expanded',String(open));if(open)syncThemeBtns();}
function setThemePref(v){if(window.__setTheme)window.__setTheme(v);syncThemeBtns();}
function syncThemeBtns(){const p=window.__getTheme?window.__getTheme():'auto';document.querySelectorAll('.theme-opt').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeOpt===p)));}
const NN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function freq(s){return 261.626*Math.pow(2,s/12);}
function nlabel(s){return NN[((s%12)+12)%12]+(4+Math.floor(s/12));}
function tone(s,dur,when,vol){
 const a=ac();
 const go=()=>{const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=freq(s);const t=a.currentTime+(when||0);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||0.25,t+0.03);g.gain.setValueAtTime(vol||0.25,t+dur-0.08);g.gain.linearRampToValueAtTime(0,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.05);};
 if(a.state==='running')go();else a.resume().then(go).catch(go);
}
/* a single percussive metronome click, optionally scheduled ahead */
function metroClick(accent,when){
 const a=ac();const t=a.currentTime+(when||0);
 const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=accent?1760:1200;
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(accent?0.3:0.2,t+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
 o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+0.09);
}
function playRoot(){setTarget(TS.root);tone(TS.root,1.5,0);}

    just as well at twice the true period, which is what made it read an octave low. */
 const thr=0.86*bestv;let pk=best;

/* ===================== SCALE-DEGREE DRILL (Practice tab, no mic) =====================
   Harmony singers hear the KEY, not bare intervals: "the melody is on mi, so I sing sol".
   Each round a I–IV–V–I cadence sets a major key, then one note plays; name its degree.
   Every answer then walks the note home to do (re→do, sol→la→ti→do), which is the teaching
   device. Two modes (v49): Learn = 10 rounds, a miss reveals and carries on (S.__deg.learn);
   Streak = one miss ends the run (S.__deg best/runs, like the ear test). Level 0 "Start" = do or sol. */
const DG_LEVELS={0:{name:'Start',sub:'do or sol — home, or open?',choices:[0,7]},1:{name:'Level 1',sub:'do · mi · sol',choices:[0,4,7]},2:{name:'Level 2',sub:'+ re · fa',choices:[0,2,4,5,7]},3:{name:'Level 3',sub:'the whole scale',choices:[0,2,4,5,7,9,11]}};

const DG_LEARN_N=10;   // learn mode: rounds per session; move up after two sessions at 8+
let dgActive=false,dgState='idle',dgStreak=0,dgRound=0,dgDeg=0,dgKey=99,dgLevel=0,dgMove=false,dgLearn=true,dgTimer=null,dgTimer2=null;
function degStore(){if(!S.__deg)S.__deg={best:{},runs:[]};const E=S.__deg;if(!E.learn)E.learn={best:{},runs:[]};return E;}
function dgKeyOf(l,m){return String(l)+(m?'k':'');}
function dgLoadPref(){const p=degStore().pref;if(p){if(DG_LEVELS[p.l])dgLevel=p.l;dgMove=!!p.m;dgLearn=p.learn!==false;}}
function dgSavePref(){degStore().pref={l:dgLevel,m:dgMove,learn:dgLearn};persist();}
/* pure: ready to move up? the last two learn sessions both 8+ out of 10 */
function dgReady(runs){const r=runs.slice(-2);return r.length===2&&r.every(x=>x.n>=8);}
/* pure: a new tonic (F3–E4), never the same as the last one */
function dgPickKey(prev,rnd){rnd=rnd||Math.random;let k=prev;for(let i=0;i<8&&(k===prev||k<-7||k>4);i++)k=-7+Math.floor(rnd()*12);return Math.max(-7,Math.min(4,k));}

function dgResolve(d){return ({0:[0],2:[2,0],4:[4,2,0],5:[5,4,2,0],7:[7,9,11,12],9:[9,11,12],11:[11,12]})[d]||[d];}

/* ===================== PICK IT OUT — voice extraction (Practice tab, mic) =====================
   Hearing your own line inside a texture: two notes sound TOGETHER, then you sing the low one,
   then the high one. The tuner shows your note but no target (no visual cheat); scoring folds
   octaves, so a low voice may sing the high note an octave down. Singing the OTHER note is named
   as such — that is the exact confusion this drill trains out. Default replays the pair before the
   high note; the harder mode doesn't (hold both in your head). Streaks in S.__vx, like S.__ear. */
const VX_LEVELS={1:{name:'Level 1',sub:'6ths — far apart',choices:[8,9]},2:{name:'Level 2',sub:'+ 3rds — closer',choices:[3,4,8,9]},3:{name:'Level 3',sub:'+ 4ths · 5ths — they blend',choices:[3,4,5,7,8,9]}};

function vxStore(){if(!S.__vx)S.__vx={best:{},runs:[]};return S.__vx;}
function vxRange(){let lo=-9,hi=5;const p=profile();if(p){lo=Math.max(-17,(p.low-60)+1);hi=Math.min(12,(p.high-60)-1);if(hi<lo+9)hi=lo+9;}return [lo,hi];}

/* pure: what did they sing? target / the other note / off / nothing (octave-folded, ±50¢) */

 if(!cap||cap.length<6)return {ok:false,which:'none',name:'—'};
 const hz=jdMed(cap.slice(-6)),name=hzToNote(hz).name;
 if(Math.abs(jdFold(hz,freq(want)))<=50)return {ok:true,which:'target',name:name};

function vxPair(t){tone(vxLow,1.6,t||0,0.2);tone(vxLow+vxIv,1.6,t||0,0.2);}

function vxListen(part){vxState=part;vxCap=[];vxSil=0;paintVX('Round '+(vxStreak+1)+' — sing the '+(part==='low'?'LOW':'HIGH')+' note');vxT2=setTimeout(()=>{if(vxState===part)judgeVX(true);},6000);}

function genMelody(){    // singable diatonic walk, 8 notes, stepwise + small leaps, resolves to tonic
 const n=8;let step=[0,2,4][Math.floor(Math.random()*3)];const out=[];
 for(let i=0;i<n-1;i++){
  out.push([SCSTEP[step],Math.random()<0.6?2:1]);
  const r=Math.random();let mv=r<0.62?(Math.random()<0.5?1:-1):r<0.9?(Math.random()<0.5?2:-2):(Math.random()<0.5?3:-3);
  step+=mv;if(step<0)step=-step;if(step>7)step=14-step;if(step<0)step=0;if(step>7)step=7;
 }

}

function classifyImprov(wins,samples,dir){

  const dirOk=(dir==='below')?(d<0):(d>0);

  const ic=Math.round(ad)%12;
  if(ic===0){doubling++;return;}                       // bare octave = doubling, not real harmony

function winMidOf(w,samples,lag){const seg=samples.filter(x=>x.t>=w.start+lag&&x.t<=w.end+lag).map(x=>69+12*Math.log2(x.hz/440));return seg.length>=3?medOf(seg):null;}
function classifyMemory(wins,samples,target,onPctReq){   // transpose-invariant: did they sing the right LINE (in any key)?
 const lag=0.15,onTol=70,tk=target||'harm';
 const mids=wins.map(w=>winMidOf(w,samples,lag));
 const cand=[];mids.forEach((m,i)=>{if(m!=null)cand.push(m-(wins[i][tk]+60));});
 let offset=null;
 if(cand.length){let bo=cand[0],bc=-1;cand.forEach(off=>{let cc=0;mids.forEach((m,i)=>{if(m!=null&&rowFold(m,wins[i][tk]+60+off)<=onTol)cc++;});if(cc>bc){bc=cc;bo=off;}});offset=bo;}   // best-fit transposition
 let correct=0,wrong=0,gap=0,cs=0;
 mids.forEach((m,i)=>{if(m==null){gap++;return;}const d=rowFold(m,wins[i][tk]+60+(offset||0));if(d<=onTol){correct++;cs+=d;}else wrong++;});
 const total=wins.length||1;
 return{clean:offset!=null&&correct>=Math.ceil(total*(onPctReq||0.7)),on:correct,collapse:0,off:wrong,gap:gap,total:total,avgHarm:correct?Math.round(cs/correct):999,pct:Math.round(correct/total*100),mem:true};
}
function classifyHarmony(wins,samples,onPctReq,colMax){   // absolute: stayed on the harmony vs collapsing onto the (known) melody
 const lag=0.15,onTol=70;let on=0,collapse=0,off=0,gap=0,cs=0;
 wins.forEach(w=>{const m=winMidOf(w,samples,lag);if(m==null){gap++;return;}const dH=rowFold(m,w.harm+60),dM=rowFold(m,w.mel+60);if(dH<=onTol&&dH<=dM){on++;cs+=dH;}else if(dM<=onTol&&dM<dH)collapse++;else off++;});

 return{clean:on>=Math.ceil(total*opr)&&collapse<=Math.floor(total*cm),on:on,collapse:collapse,off:off,gap:gap,total:total,avgHarm:on?Math.round(cs/on):999,pct:Math.round(on/total*100),mem:false};

function meta(){if(!S.__meta)S.__meta={streak:0,best:0,last:'',quick:0};const M=S.__meta;if(!Array.isArray(M.days))M.days=backfillDays(M);return M;}
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
/* Practice-day history (meta().days, 'YYYY-MM-DD', last 400). Older installs had only a streak
   counter, so on first read rebuild what we can: the current streak's run of days, every dated
   hold attempt, and each review skill's last date. */
function backfillDays(M){
 const set=new Set();
 if(M.last&&M.streak){const p=M.last.split('-').map(Number);for(let i=0;i<Math.min(M.streak,400);i++)set.add(dstr(new Date(p[0],p[1]-1,p[2]-i)));}
 Object.keys(S).forEach(k=>{const v=S[k];if(v&&Array.isArray(v.attempts))v.attempts.forEach(a=>{if(a&&a.t)set.add(dstr(new Date(a.t)));});});
 const R=M.review||{};Object.keys(R).forEach(k=>{if(R[k]&&R[k].last)set.add(R[k].last);});
 return [...set].sort().slice(-400);
}
/* the streak as of today: a run that ended before yesterday is broken, whatever was stored */
function curStreak(){const M=meta();return (M.last===todayStr()||M.last===yestStr())?(M.streak||0):0;}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function yestStr(){const d=new Date(Date.now()-86400000);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* ===================== DAILY REVIEW =====================
   The 5-minute drill is a mixed, auto-scored review of the pitch skills you've learned,
   not always the same major third. A skill joins the pool once a lesson that teaches it is
   mastered; the skill of the lesson you're on now joins too, so the review is useful from
   day one. Trials lean toward skills that are WEAK (low recent accuracy) or STALE (not
   reviewed for days) — light spaced repetition. Runs on the jump-drill engine (jdReview);
   per-skill stats live in meta().review. Drone holds stay in the lessons. */
const REVIEW_SKILLS=[
 {id:'unison',iv:0,name:'the same note',short:'Same note',from:['1.1','1.2']},
 {id:'step',iv:2,name:'one step up (re)',short:'Step up',from:['1.4']},
 {id:'M3',iv:4,name:'the 3rd above it',short:'3rd',from:['2.2','2.3']},
 {id:'P4',iv:5,name:'the 4th above it',short:'4th',from:['2.4th']},
 {id:'P5',iv:7,name:'the 5th above it',short:'5th',from:['2.4']},
 {id:'key3',inKey:true,name:'3rd in the key',short:'3rd in key',from:['2.min','2.5']}

const REVIEW_FRONT={'1.1':'unison','1.2':'unison','1.3':'unison','1.4':'step','cpA':'step','2.1':'step','2.hear':'step','2.echo':'step','2.half':'step','2.2':'M3','2.6':'M3','2.3':'M3','2.4':'P5','2.4th':'P4','2.min':'key3','2.5':'key3','cpB':'key3'};

function reviewPool(){

function reviewDays(s,today){return s&&s.last?Math.max(0,Math.round((Date.parse(today)-Date.parse(s.last))/86400000)):null;}

/* Pure: n trials over the pool — every skill once when it fits, the rest drawn by weight,

/* pure: headline + one encouraging line, never a scolding one */
function planStatus(P,days,today){

 const prev=(days||[]).filter(d=>d<today).sort();const last=prev[prev.length-1];
 const gap=last?Math.round((pdate(today)-pdate(last))/86400000):null;
 const plural=n=>n+' day'+(n===1?'':'s');
 if(done)return {title:'Done for today',msg:w.met?'That makes '+w.complete+' this week — goal met. Anything more is a bonus.':'That’s '+w.complete+' of '+g+' this week. See you tomorrow, or whenever you can.'};
 const title='Your '+P.mins+' minutes';
 if(last===undefined)return {title:title,msg:'Start small. Today’s '+P.mins+' minutes is the whole job.'};
 if(gap>=3)return {title:title,msg:'Welcome back. No catching up needed — today’s '+P.mins+' minutes is all that counts.'};
 if(w.met)return {title:title,msg:'This week’s goal is already met — today is a bonus.'};
 if(w.complete+w.left<g)return {title:title,msg:'This week’s goal is out of reach, but every day still counts — and Monday is a fresh start.'};

function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function doExport(){const blob=new Blob([JSON.stringify({lessons:S,exported:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='harmony-path-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();showToast('Backup downloaded');}
function doImport(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.lessons){S=d.lessons;persist();render();showToast('Progress restored');}}catch(e){showToast('Could not read that file');}};r.readAsText(f);ev.target.value='';}
function doReset(){if(!confirm('Erase all progress and start the path fresh? Export a backup first if unsure.'))return;S={};persist();render();showToast('Progress reset');}
init();
view='today';   /* always land on Today — it shows the range-check card itself when there is no profile yet */
render();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
</body>
</html>
